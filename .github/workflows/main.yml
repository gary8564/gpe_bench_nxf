# .github/workflows/main.yml
#
# Validates the Nextflow workflow on every push/PR using the
# self-contained high_dim_input toy example
#
# Two jobs:
#   validate — previews the DAG without executing anything
#   run      — builds the pinned conda environments and runs the
#              CPU-only benchmark on the toy case study

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      # -preview resolves the full DAG and reports which processes would run,
      # without creating environments or executing any scripts.
      - name: Preview pipeline DAG
        run: |
          nextflow run main.nf \
            -preview \
            -params-file params.yaml \
            -profile local

  run:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true

      # Run the full high_dim_input toy benchmark (CPU-only).
      # --useLockFiles true uses the pinned locks/linux-64/<name>.txt files
      # instead of re-solving from the YAML.
      # --useGPU false skips the CUDA variant of evaluate_exactgp.
      #
      # NOTE: adjust --caseStudy to match the exact parameter name and value
      # used in your params.yaml / nextflow.config.
      - name: Run toy benchmark
        run: |
          nextflow run main.nf \
            -params-file params.yaml \
            -profile local

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          if-no-files-found: warn
